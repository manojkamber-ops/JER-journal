<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 410" fill="none">
  <!-- Cover background: deep navy -->
  <rect x="0" y="0" width="300" height="410" fill="#0c2a4d"/>
  <!-- Top gold band -->
  <rect x="0" y="0" width="300" height="8" fill="#b0894f"/>
  <!-- Decorative side gold rule -->
  <rect x="18" y="60" width="2" height="320" fill="#b0894f" opacity="0.6"/>

  <!-- Issue badge (top right) -->
  <text x="282" y="40" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#d4ab68" letter-spacing="1.5">VOLUME 30</text>
  <text x="282" y="55" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#d4ab68" letter-spacing="1.5">ISSUE 3 · 2025</text>

  <!-- Journal title -->
  <text x="36" y="100" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f7f3e9" letter-spacing="0.3">Journal of</text>
  <text x="36" y="128" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f7f3e9" letter-spacing="0.3">Economic</text>
  <text x="36" y="156" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f7f3e9" letter-spacing="0.3">Research</text>

  <!-- Gold rule under title -->
  <rect x="36" y="172" width="180" height="1.5" fill="#b0894f"/>

  <!-- Subtitle -->
  <text x="36" y="194" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#d4ab68">A Peer-Reviewed Open Access Journal</text>

  <!-- Article preview -->
  <text x="36" y="240" font-family="Georgia, serif" font-size="10" fill="#f7f3e9" opacity="0.75" letter-spacing="1">IN THIS ISSUE</text>
  <rect x="36" y="248" width="50" height="1" fill="#b0894f"/>
  <text x="36" y="270" font-family="Georgia, serif" font-size="10" fill="#f7f3e9">Artificial Intelligence, Productivity,</text>
  <text x="36" y="284" font-family="Georgia, serif" font-size="10" fill="#f7f3e9">and Wage Inequality</text>
  <text x="36" y="304" font-family="Georgia, serif" font-style="italic" font-size="9" fill="#d4ab68">Choi, Yang &amp; Dubois</text>

  <text x="36" y="328" font-family="Georgia, serif" font-size="10" fill="#f7f3e9">Monetary Policy Transmission</text>
  <text x="36" y="342" font-family="Georgia, serif" font-size="10" fill="#f7f3e9">in Emerging Asia</text>
  <text x="36" y="362" font-family="Georgia, serif" font-style="italic" font-size="9" fill="#d4ab68">Park, Chen &amp; Kumar</text>

